<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>数据集定义编辑器 · Dataset Manifest Editor</title>
    <!-- 设计令牌基准，必须在 dataset.css 之前 -->
    <link href="styles/kb.css" rel="stylesheet">
    <link href="styles/dataset.css" rel="stylesheet">
</head>

<body>
    <div class="app app--dataset" id="app">

        <!-- ============ 顶栏 ============ -->
        <header class="topbar" id="topbar">
            <button class="btn drawer-toggle" id="drawerToggle" title="数据集列表">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>

            <div class="brand">
                <div class="logo">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 15c6.667-6 13.333 0 20-6" />
                        <path d="M9 22c1.798-1.998 2.518-3.995 2.807-5.993" />
                        <path d="M15 2c-1.798 1.998-2.518 3.995-2.807 5.993" />
                        <path d="m17 6-9 12" />
                        <path d="m17 18-9-12" />
                    </svg>
                </div>
                <div>
                    <h1>数据集定义编辑器</h1>
                    <div class="topic" id="topicLine">未命名 · dataset.json</div>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- 单 / 多组学模式切换 -->
            <div class="segmented" id="modeSwitch" role="tablist" aria-label="组学模式">
                <button type="button" data-mode="single" role="tab">单组学</button>
                <button type="button" data-mode="multi" class="active" role="tab">多组学</button>
            </div>

            <button class="btn" id="loadBtn" title="载入已有的 dataset.json 进行二次编辑">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                载入
            </button>

            <button class="btn primary" id="saveBtn" title="保存为 dataset.json">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                保存
            </button>

            <button class="btn" id="previewBtn" title="切换 JSON 预览面板">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                </svg>
                预览
            </button>

            <button class="btn" id="themeBtn" title="切换主题">
                <span id="themeIcon">🌙</span><span id="themeLabel">暗色</span>
            </button>
        </header>

        <!-- ============ 左侧栏：数据集列表 ============ -->
        <aside class="sidebar" id="sidebar">
            <h2>数据集列表</h2>
            <input class="search" id="searchInput" placeholder="筛选 id / 名称 / 类型…" autocomplete="off" />
            <div class="doc-list" id="datasetList"></div>
            <button class="add-dataset" id="addDatasetBtn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                添加数据集
            </button>
        </aside>

        <div class="scrim" id="scrim"></div>

        <!-- ============ 主内容区 ============ -->
        <main class="content" id="content">
            <div class="view" id="view">

                <!-- 基本信息 -->
                <section class="card card--blue" id="basicCard">
                    <h3><span class="dot"></span>数据集基本信息</h3>
                    <div id="basicBody"></div>
                </section>

                <!-- 文件路径 -->
                <section class="card card--teal" id="pathCard">
                    <h3><span class="dot"></span>数据文件路径</h3>
                    <div id="pathBody"></div>
                </section>

                <!-- 样本对齐 -->
                <section class="card card--purple" id="alignmentCard">
                    <h3><span class="dot"></span>样本对齐 sample_alignment</h3>
                    <div id="alignmentBody"></div>
                </section>

                <!-- 校验结果 -->
                <section class="card card--gray" id="validationCard">
                    <h3><span class="dot"></span>校验结果</h3>
                    <div id="validationBody"></div>
                </section>

            </div>
        </main>

        <!-- ============ JSON 预览抽屉 ============ -->
        <aside class="preview-panel" id="previewPanel" aria-hidden="true">
            <div class="preview-head">
                <span class="preview-title">dataset.json</span>
                <span class="spacer"></span>
                <button class="btn btn-mini" id="copyJsonBtn" title="复制到剪贴板">复制</button>
                <button class="btn btn-mini" id="downloadJsonBtn" title="下载到本地">下载</button>
                <button class="btn btn-mini" id="closePreviewBtn" title="关闭预览">✕</button>
            </div>
            <pre class="preview-code" id="previewCode"></pre>
            <div class="preview-foot" id="previewStat">0 字符</div>
        </aside>

    </div>

    <!-- 吐司提示容器 -->
    <div class="toast-host" id="toastHost" aria-live="polite"></div>

    <script src="js/dataset.js" type="text/javascript"></script>
</body>

</html>
