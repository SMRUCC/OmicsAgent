<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文献知识库 · Knowledge Base Explorer</title>
<!-- Markdown 渲染（CDN） -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  /* ===================== 设计令牌 ===================== */
  :root {
    --primary: #10B981;
    --primary-2: #14B8A6;
    --primary-3: #059669;
    --info: #0EA5E9;
    --warn: #F59E0B;
    --danger: #EF4444;
    --radius: 16px;
    --radius-sm: 10px;
    --font: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  html[data-theme="light"] {
    --bg-0: #F0FDF9;
    --bg-1: #ECFEFF;
    --bg-2: #D1FAE5;
    --text: #0F172A;
    --text-soft: #064E3B;
    --text-muted: #475569;
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --solid: #FFFFFF;
    --border: rgba(16, 185, 129, 0.20);
    --border-strong: rgba(16, 185, 129, 0.45);
    --shadow: 0 10px 30px -12px rgba(6, 78, 59, 0.25);
    --shadow-soft: 0 4px 16px -8px rgba(6, 78, 59, 0.20);
    --blob-a: rgba(20, 184, 166, 0.28);
    --blob-b: rgba(16, 185, 129, 0.22);
    --tag-bg: rgba(16, 185, 129, 0.12);
    --tag-text: #047857;
    --code-bg: rgba(6, 78, 59, 0.06);
  }
  html[data-theme="dark"] {
    --bg-0: #0A1410;
    --bg-1: #0B1B16;
    --bg-2: #06120D;
    --text: #E2E8F0;
    --text-soft: #A7F3D0;
    --text-muted: #94A3B8;
    --glass: rgba(15, 31, 24, 0.62);
    --glass-strong: rgba(15, 31, 24, 0.82);
    --solid: #0F1F18;
    --border: rgba(52, 211, 153, 0.18);
    --border-strong: rgba(52, 211, 153, 0.5);
    --shadow: 0 12px 36px -12px rgba(0, 0, 0, 0.6);
    --shadow-soft: 0 4px 18px -8px rgba(0, 0, 0, 0.55);
    --blob-a: rgba(20, 184, 166, 0.18);
    --blob-b: rgba(16, 185, 129, 0.16);
    --tag-bg: rgba(16, 185, 129, 0.16);
    --tag-text: #6EE7B7;
    --code-bg: rgba(167, 243, 208, 0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg-0);
    overflow: hidden;
    transition: background-color .35s ease, color .35s ease;
  }
  /* 背景生物感光斑 */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(48vw 48vw at 12% 8%, var(--blob-a), transparent 60%),
      radial-gradient(40vw 40vw at 88% 22%, var(--blob-b), transparent 60%),
      radial-gradient(46vw 46vw at 70% 96%, var(--blob-a), transparent 62%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
    transition: opacity .35s ease;
  }

  /* ===================== 布局 ===================== */
  .app { display: grid; grid-template-columns: 312px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header.topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo {
    width: 38px; height: 38px; flex: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: grid; place-items: center; color: #fff; font-size: 20px;
    box-shadow: 0 6px 16px -6px var(--primary-3);
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .brand .topic { font-size: 12px; color: var(--text-muted); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  .topbar .spacer { flex: 1; }
  .btn {
    font-family: var(--font); font-size: 13.5px; font-weight: 600;
    color: var(--text); background: var(--glass); cursor: pointer;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 9px 15px; display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--shadow-soft); }
  .btn:active { transform: translateY(0); }
  .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; }
  .btn.primary:hover { box-shadow: 0 8px 20px -8px var(--primary-3); }
  .btn .ico { width: 18px; height: 18px; display: inline-block; }

  /* 侧栏 */
  aside.sidebar {
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(130%);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    border-right: 1px solid var(--border);
    padding: 18px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    min-height: 0; /* 关键：允许网格项内部独立滚动，避免内容被 body 裁切 */
  }
  .sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin: 4px 6px 0; }
  .search {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--glass-strong); color: var(--text);
    font-family: var(--font); font-size: 13px; outline: none; transition: border-color .2s;
  }
  .search:focus { border-color: var(--primary); }
  .doc-list { display: flex; flex-direction: column; gap: 8px; }
  .doc-item {
    text-align: left; cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-sm);
    background: var(--glass-strong); padding: 11px 13px; color: var(--text);
    transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
    display: flex; flex-direction: column; gap: 3px;
  }
  .doc-item:hover { transform: translateX(3px); border-color: var(--border-strong); box-shadow: var(--shadow-soft); }
  .doc-item.active { border-color: var(--primary); background: var(--tag-bg); box-shadow: 0 0 0 1px var(--primary) inset; }
  .doc-item .fname { font-size: 11.5px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .doc-item .title { font-size: 13.5px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .doc-item .src { font-size: 11px; color: var(--primary-2); margin-top: 2px; }

  /* 主区 */
  main.content { overflow-y: auto; padding: 24px 30px 60px; min-height: 0; min-width: 0; }
  .view { max-width: 1080px; margin: 0 auto; animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 20px; box-shadow: var(--shadow);
    animation: rise .4s ease both;
  }
  .card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 9px; color: var(--text-soft); }
  .card h3 .dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-2)); }

  .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .meta-cell .k { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); }
  .meta-cell .v { font-size: 14.5px; font-weight: 600; margin-top: 3px; word-break: break-word; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px; cursor: pointer; user-select: none;
    background: var(--tag-bg); color: var(--tag-text); border: 1px solid transparent;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  }
  .tag:hover { transform: translateY(-2px); }
  .tag.active { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; box-shadow: 0 6px 14px -6px var(--primary-3); }

  .ref-list { display: flex; flex-direction: column; gap: 10px; }
  .ref {
    border-left: 3px solid var(--primary-2); padding: 4px 0 4px 13px; font-size: 13.5px; line-height: 1.5;
  }
  .ref .rt { font-weight: 600; }
  .ref .rm { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }

  .mech { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; margin-bottom: 12px;
    background: var(--glass-strong); transition: border-color .2s, transform .15s; }
  .mech:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .mech .m { font-size: 14px; line-height: 1.6; }
  .mech .e { font-size: 12.5px; color: var(--text-soft); margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .mech .e b { color: var(--primary-3); }

  .pill-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .kv-pill { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 15px; min-width: 160px; flex: 1; }
  .kv-pill .k { font-size: 11px; letter-spacing: .6px; color: var(--text-muted); text-transform: uppercase; }
  .kv-pill .v { font-size: 14px; font-weight: 600; margin-top: 5px; line-height: 1.5; }

  .relevance p { font-size: 14px; line-height: 1.75; color: var(--text-soft); }

  /* markdown 正文 */
  .markdown-body { font-size: 15px; line-height: 1.8; color: var(--text); word-wrap: break-word; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--text-soft); line-height: 1.35; margin: 1.4em 0 .6em; }
  .markdown-body h1 { font-size: 1.7em; }
  .markdown-body h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .markdown-body h3 { font-size: 1.18em; }
  .markdown-body p { margin: .7em 0; }
  .markdown-body a { color: var(--primary-3); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
  .markdown-body a:hover { border-bottom-color: var(--primary-3); }
  .markdown-body code { background: var(--code-bg); padding: .15em .45em; border-radius: 6px; font-size: .9em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .markdown-body pre { background: var(--code-bg); padding: 14px 16px; border-radius: var(--radius-sm); overflow-x: auto; border: 1px solid var(--border); }
  .markdown-body pre code { background: none; padding: 0; }
  .markdown-body blockquote { border-left: 3px solid var(--primary-2); margin: .8em 0; padding: .2em 0 .2em 14px; color: var(--text-muted); }
  .markdown-body ul, .markdown-body ol { padding-left: 1.4em; margin: .6em 0; }
  .markdown-body li { margin: .35em 0; }
  .markdown-body table { border-collapse: collapse; width: 100%; margin: .8em 0; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 7px 10px; }
  .markdown-body sup { font-size: .72em; color: var(--primary-3); }
  .markdown-body img { max-width: 100%; border-radius: 8px; }

  /* 状态/错误 */
  .banner { border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13.5px; line-height: 1.6; margin-bottom: 18px; }
  .banner.err { background: rgba(239, 68, 68, .12); border: 1px solid rgba(239, 68, 68, .4); color: var(--danger); }
  .banner.info { background: var(--tag-bg); border: 1px solid var(--border-strong); color: var(--text-soft); }
  .skeleton { height: 16px; border-radius: 8px; margin: 10px 0;
    background: linear-gradient(90deg, var(--glass-strong), var(--border), var(--glass-strong));
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  .empty { text-align: center; color: var(--text-muted); padding: 80px 20px; }
  .empty .big { font-size: 46px; margin-bottom: 12px; opacity: .7; }

  .drawer-toggle { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside.sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 300px; z-index: 50;
      transform: translateX(-105%); transition: transform .3s ease; }
    aside.sidebar.open { transform: none; box-shadow: var(--shadow); }
    .drawer-toggle { display: inline-flex; }
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; }
    .scrim.show { display: block; }
    main.content { padding: 18px 16px 50px; }
    .brand .topic { display: none; }
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="btn drawer-toggle" id="drawerToggle" title="文献列表">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <div class="logo">🧬</div>
      <div>
        <h1>文献知识库</h1>
        <div class="topic" id="topicLine">生命科学文献知识库浏览器</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="summaryBtn">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      知识库汇总
    </button>
    <button class="btn" id="themeBtn" title="切换主题">
      <span id="themeIcon">🌙</span><span id="themeLabel">暗色</span>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">
    <h2>文献列表</h2>
    <input class="search" id="searchInput" placeholder="筛选文献 / 文件名…" />
    <div class="doc-list" id="docList"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="content" id="content">
    <div class="empty">
      <div class="big">🧪</div>
      <div>从左侧选择一篇文献，或点击右上角「知识库汇总」查看整合知识库。</div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ===================== 配置 ===================== */
  const BASE_URL = "http://localhost"; // 知识库服务根地址（CORS 已开启）
  let activeToken = 0; // 异步请求令牌：防止快速切换文献/汇总时的竞态覆盖

  /* ===================== 缓存 ===================== */
  const cache = {
    docList: null,
    perDoc: new Map(),   // jsonName -> per_doc 对象
    txt: new Map(),      // sourceFile -> 解析后的 {title, meta, references, body}
    kb: null,
    titles: new Map(),   // jsonName -> 文献标题（用于侧栏显示）
  };

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ===================== 主题 ===================== */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    const dark = theme === "dark";
    $("#themeIcon").textContent = dark ? "☀️" : "🌙";
    $("#themeLabel").textContent = dark ? "亮色" : "暗色";
    try { localStorage.setItem("kb-theme", theme); } catch (e) {}
  }
  function initTheme() {
    let t = null;
    try { t = localStorage.getItem("kb-theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    applyTheme(t);
  }
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  /* ===================== 网络层 ===================== */
  async function getText(path) {
    const res = await fetch(BASE_URL + "/" + path, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " · " + path);
    return await res.text();
  }
  async function getJson(path) {
    const txt = await getText(path);
    return JSON.parse(txt);
  }

  /* 解析 files.txt：兼容 JSON 数组 与 换行文本 两种格式 */
  function parseFileList(raw) {
    raw = raw.trim();
    if (!raw) return [];
    try {
      const j = JSON.parse(raw);
      if (Array.isArray(j)) return j.map((x) => String(x).trim()).filter(Boolean);
    } catch (e) { /* 不是 JSON，按换行解析 */ }
    return raw.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
  }

  /* 解析 txt 原文（前 4 行结构化，其后为 markdown 全文） */
  function parseDocTxt(raw) {
    const lines = raw.split(/\r?\n/);
    const title = (lines[0] || "").trim();
    let meta = {};
    try { meta = JSON.parse(lines[1] || "{}"); } catch (e) { meta = { raw: lines[1] || "" }; }
    let references = [];
    try { references = JSON.parse(lines[2] || "[]"); } catch (e) { references = []; }
    let bodyStart = (lines.length > 3 && lines[3].trim() === "") ? 4 : 3;
    const body = lines.slice(bodyStart).join("\n").trim();
    return {
      title,
      meta: { doi: meta.doi || "", year: meta.year || "", journal: meta.journal || "", keywords: Array.isArray(meta.keywords) ? meta.keywords : [] },
      references: Array.isArray(references) ? references : [],
      body,
    };
  }

  /* ===================== Markdown ===================== */
  function renderMarkdown(md) {
    if (md == null || md === "") return "";
    if (typeof marked !== "undefined" && marked.parse) {
      try { return marked.parse(md); } catch (e) { console.warn("marked 解析失败，降级为纯文本", e); }
    }
    // 降级：保留换行与基础转义
    return "<pre>" + esc(md) + "</pre>";
  }

  /* ===================== 侧栏 ===================== */
  function renderDocList(list) {
    const box = $("#docList");
    box.innerHTML = "";
    list.forEach((name) => {
      const item = el("button", "doc-item");
      item.dataset.name = name;
      const title = cache.titles.get(name);
      let html = '<span class="fname">' + esc(name) + "</span>";
      if (title) html += '<span class="title">' + esc(title) + "</span>";
      item.innerHTML = html;
      item.addEventListener("click", () => selectDoc(name));
      box.appendChild(item);
    });
  }

  function updateDocItemTitle(name, title) {
    cache.titles.set(name, title);
    const item = document.querySelector('.doc-item[data-name="' + CSS.escape(name) + '"]');
    if (item) {
      let t = item.querySelector(".title");
      if (!t) {
        t = document.createElement("span");
        t.className = "title";
        item.appendChild(t);
      }
      t.textContent = title;
    }
  }

  /* ===================== 知识点渲染 ===================== */
  // 通用：根据字段渲染（per_doc 与 kb.json 共用，因字段同名）
  function tagSection(titleText, arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "";
    const tags = arr.map((x) => '<span class="tag">' + esc(x) + "</span>").join("");
    return '<div class="card"><h3><span class="dot"></span>' + esc(titleText) + "（" + arr.length + "）</h3>" +
      '<div class="tags">' + tags + "</div></div>";
  }

  function mechanismsSection(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "";
    const cards = arr.map((m) => {
      const mech = (m && m.mechanism) ? m.mechanism : "";
      const ev = (m && m.evidence) ? m.evidence : "";
      return '<div class="mech"><div class="m">' + esc(mech) + "</div>" +
        (ev ? '<div class="e"><b>证据：</b>' + esc(ev) + "</div>" : "") + "</div>";
    }).join("");
    return '<div class="card"><h3><span class="dot"></span>生物机制（' + arr.length + "）</h3>" + cards + "</div>";
  }

  /* 仅 kb.json 汇总包含：对比设计建议 */
  function comparisonSection(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "";
    const cards = arr.map((c) => {
      const comp = (c && c.comparison) ? c.comparison : "";
      const purp = (c && c.purpose) ? c.purpose : "";
      return '<div class="mech"><div class="m">' + esc(comp) + "</div>" +
        (purp ? '<div class="e"><b>目的：</b>' + esc(purp) + "</div>" : "") + "</div>";
    }).join("");
    return '<div class="card"><h3><span class="dot"></span>对比设计建议（' + arr.length + "）</h3>" + cards + "</div>";
  }

  /* 仅 kb.json 汇总包含：预期发现 */
  function expectedFindingsSection(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "";
    const items = arr.map((x) => '<div class="ref"><div class="m">' + esc(x) + "</div></div>").join("");
    return '<div class="card"><h3><span class="dot"></span>预期发现（' + arr.length + "）</h3><div class=\"ref-list\">" + items + "</div></div>";
  }

  /* 仅 kb.json 汇总包含：核心参考文献（含关键发现） */
  function kbReferencesSection(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "";
    const refs = arr.map((r) =>
      '<div class="ref"><div class="rt">' + esc((r && r.title) || "（无标题）") + "</div>" +
      (r && r.key_finding ? '<div class="rm" style="margin-top:4px"><b style="color:var(--primary-3)">关键发现：</b>' + esc(r.key_finding) + "</div>" : "") +
      "</div>"
    ).join("");
    return '<div class="card"><h3><span class="dot"></span>核心参考文献（' + arr.length + "）</h3><div class=\"ref-list\">" + refs + "</div></div>";
  }

  function renderKnowledge(obj) {
    let html = "";
    // 概览字段（kb.json 汇总包含；per_doc 不含）
    const overview = [
      ["research_topic", "研究主题"],
      ["disease_or_phenotype", "疾病 / 表型"],
      ["organism", "物种"],
      ["tissue", "组织 / 样本"],
    ];
    const ov = overview.filter(([k]) => obj[k]);
    if (ov.length) {
      const pills = ov.map(([k, label]) =>
        '<div class="kv-pill"><div class="k">' + esc(label) + '</div><div class="v">' + esc(obj[k]) + "</div></div>"
      ).join("");
      html += '<div class="card"><h3><span class="dot"></span>概览</h3><div class="pill-row">' + pills + "</div></div>";
    }
    // 列表型知识点
    html += tagSection("关键基因 / 蛋白", obj.key_genes_proteins);
    html += tagSection("关键通路", obj.key_pathways);
    html += tagSection("关键代谢物", obj.key_metabolites);
    html += tagSection("关键发现", obj.key_findings);
    // 机制
    html += mechanismsSection(obj.biological_mechanisms);
    // 相关性
    if (obj.relevance_to_research_topic) {
      html += '<div class="card relevance"><h3><span class="dot"></span>与研究主题相关性</h3><p>' +
        esc(obj.relevance_to_research_topic) + "</p></div>";
    }
    // 仅 kb.json 汇总包含的三类区块（per_doc 无这些字段，依存在性跳过）
    html += comparisonSection(obj.comparison_design_suggestions);
    html += expectedFindingsSection(obj.expected_findings);
    html += kbReferencesSection(obj.references);
    return html;
  }

  /* ===================== 文献详情视图 ===================== */
  async function selectDoc(name) {
    document.querySelectorAll(".doc-item").forEach((d) => d.classList.toggle("active", d.dataset.name === name));
    closeDrawer();
    const main = $("#content");
    main.scrollTop = 0; // 切换时重置滚动位置
    const token = ++activeToken; // 本次请求的令牌
    main.innerHTML = '<div class="view"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:80%"></div></div>';

    try {
      // 惰性加载 per_doc 知识点 json（带缓存）
      let perDoc;
      if (cache.perDoc.has(name)) {
        perDoc = cache.perDoc.get(name);
      } else {
        perDoc = await getJson(name);
        if (token !== activeToken) return; // 已切换，丢弃过期结果
        cache.perDoc.set(name, perDoc);
      }

      // 惰性加载关联的 txt 全文（带缓存）
      const src = perDoc.source_file;
      let parsed;
      if (cache.txt.has(src)) {
        parsed = cache.txt.get(src);
      } else {
        const raw = await getText(src);
        if (token !== activeToken) return; // 已切换，丢弃过期结果
        parsed = parseDocTxt(raw);
        cache.txt.set(src, parsed);
      }
      updateDocItemTitle(name, parsed.title);

      let view = '<div class="view">';
      // 元数据卡片
      view += '<div class="card"><h3><span class="dot"></span>' + esc(parsed.title || name) + "</h3>" +
        '<div class="meta-grid">' +
        '<div class="meta-cell"><div class="k">DOI</div><div class="v">' + (parsed.meta.doi ? '<a href="https://doi.org/' + esc(parsed.meta.doi) + '" target="_blank" rel="noopener">' + esc(parsed.meta.doi) + "</a>" : "—") + "</div></div>" +
        '<div class="meta-cell"><div class="k">年份</div><div class="v">' + esc(parsed.meta.year || "—") + "</div></div>" +
        '<div class="meta-cell"><div class="k">期刊</div><div class="v">' + esc(parsed.meta.journal || "—") + "</div></div>" +
        '<div class="meta-cell"><div class="k">来源文件</div><div class="v">' + esc(src) + "</div></div>" +
        "</div>" +
        (parsed.meta.keywords.length ? '<div style="margin-top:14px"><div class="k" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px">关键词</div><div class="tags" style="margin-top:6px">' +
          parsed.meta.keywords.map((k) => '<span class="tag">' + esc(k) + "</span>").join("") + "</div></div>" : "") +
        "</div>";

      // 参考文献
      if (parsed.references.length) {
        const refs = parsed.references.map((r) =>
          '<div class="ref"><div class="rt">' + esc(r.title || "（无标题）") + "</div>" +
          '<div class="rm">' + esc([r.year, r.journal, r.doi].filter(Boolean).join(" · ")) + "</div></div>"
        ).join("");
        view += '<div class="card"><h3><span class="dot"></span>参考文献（' + parsed.references.length + "）</h3><div class=\"ref-list\">" + refs + "</div></div>";
      }

      // 全文
      view += '<div class="card"><h3><span class="dot"></span>全文（Markdown）</h3><div class="markdown-body">' + renderMarkdown(parsed.body) + "</div></div>";

      // 关联知识点（per_doc）
      view += '<div style="margin:22px 0 6px;font-size:13px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase">提炼知识点 · ' + esc(name) + "</div>";
      view += renderKnowledge(perDoc);

      view += "</div>";
      if (token !== activeToken) return; // 渲染前再次校验，避免竞态覆盖
      main.innerHTML = view;
      bindTagToggle();
    } catch (err) {
      if (token !== activeToken) return; // 过期请求的错误不覆盖当前视图
      console.error("加载文献失败", name, err);
      main.innerHTML = '<div class="view"><div class="banner err"><b>加载失败：</b>' +
        esc(err.message) + "<br/>请确认服务已启动（serve_kb.py）且地址为 " + esc(BASE_URL) + "。</div></div>";
    }
  }

  /* ===================== 汇总视图 (kb.json) ===================== */
  async function showSummary() {
    document.querySelectorAll(".doc-item").forEach((d) => d.classList.remove("active"));
    closeDrawer();
    const main = $("#content");
    main.scrollTop = 0; // 切换时重置滚动位置
    const token = ++activeToken; // 本次请求的令牌
    main.innerHTML = '<div class="view"><div class="skeleton" style="width:50%"></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:75%"></div></div>';
    try {
      const kb = cache.kb || (cache.kb = await getJson("kb.json"));
      if (token !== activeToken) return; // 已切换，丢弃过期结果
      if (kb.research_topic) $("#topicLine").textContent = "主题：" + kb.research_topic;
      let view = '<div class="view">';
      view += '<div class="card"><h3><span class="dot"></span>知识库汇总（kb.json）</h3>' +
        '<div style="color:var(--text-soft);font-size:14px;line-height:1.7">' +
        (kb.research_topic ? "研究主题：" + esc(kb.research_topic) : "") + "</div></div>";
      view += renderKnowledge(kb);
      view += "</div>";
      if (token !== activeToken) return; // 渲染前再次校验，避免竞态覆盖
      main.innerHTML = view;
      bindTagToggle();
    } catch (err) {
      if (token !== activeToken) return; // 过期请求的错误不覆盖当前视图
      console.error("加载 kb.json 失败", err);
      main.innerHTML = '<div class="view"><div class="banner err"><b>加载 kb.json 失败：</b>' +
        esc(err.message) + "</div></div>";
    }
  }
  $("#summaryBtn").addEventListener("click", showSummary);

  /* 标签点击高亮 */
  function bindTagToggle() {
    document.querySelectorAll(".tag").forEach((t) => {
      t.addEventListener("click", () => t.classList.toggle("active"));
    });
  }

  /* ===================== 抽屉（移动端） ===================== */
  function openDrawer() { $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
  function closeDrawer() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
  $("#drawerToggle").addEventListener("click", openDrawer);
  $("#scrim").addEventListener("click", closeDrawer);

  /* ===================== 搜索筛选 ===================== */
  $("#searchInput").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".doc-item").forEach((it) => {
      const hay = (it.dataset.name + " " + (cache.titles.get(it.dataset.name) || "")).toLowerCase();
      it.style.display = !q || hay.includes(q) ? "" : "none";
    });
  });

  /* ===================== 启动 ===================== */
  async function init() {
    initTheme();
    try {
      const raw = await getText("files.txt");
      const list = parseFileList(raw);
      cache.docList = list;
      renderDocList(list);
    } catch (err) {
      console.error("加载 files.txt 失败", err);
      $("#content").innerHTML = '<div class="view"><div class="banner err"><b>无法获取文献列表（/files.txt）：</b>' +
        esc(err.message) + "<br/>请确认已启动 serve_kb.py 且该目录下存在 files.txt。</div></div>";
    }
  }

  init();
})();
</script>
</body>
</html>
