; OmicsAgent 运行环境配置文件
; 请在使用本程序之前，将下列各项配置项设置为实际环境中的正确取值。

[tools]
; R 语言脚本解释器路径
rscript = C:\Program Files\R\R-4.5.0\bin\Rscript.exe
; wkhtmltopdf 工具路径，用于渲染 HTML 报告为 PDF 格式
wkhtmltopdf = C:\Program Files\wkhtmltopdf\bin\wkhtmltopdf.exe
; R# 语言解释器（GCModeller 工作环境）路径
rsharp = G:\GCModeller\src\R-sharp\App\net10.0\R#.exe
; python 解释器路径
python = C:\ProgramData\anaconda3\python.exe

[llm]
; 大语言模型服务的 HTTP 接口 URL 地址
url = openai://api.deepseek.com
; 默认使用的 LLM 模型名称
model = deepseek-v4-flash
; 访问 LLM 服务时所使用的 API 密钥（若本地部署无需填写）
apikey = sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

[mysql]
; 用于本地查询 NCBI PubMed 文献数据库的 MySQL 服务器
host = localhost
port = 3306
; PubMed 文献数据库名称
database = pubmed
user = root
password = 

[literature]
; 文献检索策略：none 表示不进行文献检索；mysql 表示从本地 PubMed 镜像检索；ncbi 表示从 NCBI 在线检索
strategy = none
; 单次检索所返回的最大文献数量
max_count = 20
; 是否启用相关文献的自动检索功能
auto_search = false

[analysis]
; 差异表达分析的 p-value 显著性阈值
diff_pvalue = 0.05
; 代谢组学 VIP 值阈值，用于筛选关键代谢物
metabolite_vip = 1.0
; WGCNA 共表达网络分析中，按 MAD 值排序筛选的前 N 个基因
wgcna_top_mad = 20000
; 差异分析中所保留的 Top 差异特征数量
diff_top_count = 500
